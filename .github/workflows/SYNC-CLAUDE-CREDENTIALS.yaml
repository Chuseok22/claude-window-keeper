# ===================================================================
# Claude OAuth 자격증명 NAS 수동 동기화
# ===================================================================
#
# claude-window-keeper 컨테이너가 쓰는 Claude Code OAuth refresh token이
# 완전히 만료되면(AuthExpiredError, Discord 알림 발송) 사람이 로컬에서
# `claude` CLI로 재로그인해야 합니다. 이 워크플로우는 그 재로그인 결과
# (~/.claude/.credentials.json)를 NAS 볼륨에 반영하는 용도로만 씁니다.
#
# ⚠️ workflow_dispatch로만 수동 실행됩니다. main push로 트리거되는
# PROJECT-GO-SIMPLE-CICD.yaml 배포 파이프라인과는 완전히 분리되어 있습니다
# — 매 배포마다 자동 실행되면, 컨테이너가 이미 refresh해서 최신 상태인
# 토큰을 여기 저장된 구버전 secret 값으로 덮어써버릴 수 있기 때문입니다.
#
# 컨테이너 재시작/재배포는 필요 없습니다 — internal/provider/provider.go의
# fetchWithAuth가 401 응답마다 디스크에서 자격증명을 다시 읽으므로, 파일만
# 갱신하면 스케줄러의 다음 재시도 사이클에서 자동으로 복구됩니다.
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
# CLAUDE_CREDENTIALS_JSON: ~/.claude/.credentials.json 파일 전체 내용
#   재로그인할 때마다 사람이 직접 갱신합니다:
#     gh secret set CLAUDE_CREDENTIALS_JSON < ~/.claude/.credentials.json
#
# 아래는 PROJECT-GO-SIMPLE-CICD.yaml과 동일한 값을 그대로 재사용합니다
# (새로 등록할 필요 없음):
# SERVER_HOST / SERVER_USER / SERVER_PASSWORD / SSH_KEY
# ===================================================================
#
# 사용 절차:
#   1. 로컬에서 `claude` CLI로 재로그인
#   2. gh secret set CLAUDE_CREDENTIALS_JSON < ~/.claude/.credentials.json
#   3. GitHub Actions 탭에서 이 워크플로우를 수동 실행 (Run workflow)
#   4. 실행이 성공하면 즉시 gh secret delete CLAUDE_CREDENTIALS_JSON로 secret을
#      삭제한다 — 나중에 워크플로우가 실수로(예: GitHub의 "Re-run job") 다시
#      실행되면 그 시점의 secret 값이 그대로 NAS에 반영되는데, 이미 refresh로
#      회전됐거나 재로그인 이전의 오래된/폐기된 토큰일 수 있어 인증을 오히려
#      깨뜨릴 수 있다. secret을 지워두면 실수로 재실행돼도 아래 -z 가드에서
#      즉시 종료된다.
# ===================================================================

name: SYNC-CLAUDE-CREDENTIALS

on:
  workflow_dispatch:

env:
  PROJECT_NAME: "claude-window-keeper"
  CONTAINER_NAME: ""
  SSH_AUTH_METHOD: "password"
  SSH_PORT: "2022"
  SSH_COMMAND_TIMEOUT: "120s"
  SSH_CONNECTION_TIMEOUT: "60s"

jobs:
  sync:
    name: Claude 자격증명 NAS 동기화
    runs-on: ubuntu-latest

    steps:
      - name: NAS에 자격증명 반영 및 인증 복구 검증
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSH_AUTH_METHOD: ${{ env.SSH_AUTH_METHOD }}
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          command_timeout: ${{ env.SSH_COMMAND_TIMEOUT }}
          timeout: ${{ env.SSH_CONNECTION_TIMEOUT }}
          envs: SSH_AUTH_METHOD,CLAUDE_CREDENTIALS_JSON,SERVER_PASSWORD
          script: |
            set -e

            echo "🔧 환경변수 설정.."
            export PATH=$PATH:/usr/local/bin
            # env/envs로 전달된 값을 그대로 참조(워크플로우 표현식으로 직접
            # 삽입하지 않음) - 비밀번호에 공백/따옴표/$가 있어도 셸 파싱이
            # 깨지지 않는다 (PR #21 리뷰, CodeRabbit).
            export PW="$SERVER_PASSWORD"

            # 🔐 SSH 인증 방식에 따른 sudo 추상화 (PROJECT-GO-SIMPLE-CICD.yaml과 동일)
            #   password 모드: echo $PW | sudo -S  (Synology 등 sudo 비밀번호 필요 서버)
            #   key 모드: sudo 직접  (AWS EC2 등 passwordless sudo 서버)
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            echo "🔐 SSH 인증 방식: ${SSH_AUTH_METHOD}"

            if [ -z "$CLAUDE_CREDENTIALS_JSON" ]; then
              echo "❌ CLAUDE_CREDENTIALS_JSON secret이 비어 있습니다"
              exit 1
            fi

            if [ -z "${{ env.CONTAINER_NAME }}" ]; then
              CONTAINER_NAME="${{ env.PROJECT_NAME }}"
            else
              CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            fi

            # VOLUME_HOST_PATH를 하드코딩하지 않고 실행 중인 컨테이너의 실제
            # 볼륨 마운트에서 직접 가져온다 — PROJECT-GO-SIMPLE-CICD.yaml과
            # 값이 어긋나면(마법사 재동기화 등) 컨테이너가 실제로 마운트하지
            # 않은 경로에 쓰고도 검증이 우연히 통과하는 false positive가
            # 생길 수 있기 때문이다.
            VOLUME_HOST_PATH=$(SUDO docker inspect -f '{{range .Mounts}}{{if eq .Destination "/home/keeper"}}{{.Source}}{{end}}{{end}}' "$CONTAINER_NAME")
            if [ -z "$VOLUME_HOST_PATH" ]; then
              echo "❌ 컨테이너 $CONTAINER_NAME 의 /home/keeper 볼륨 마운트를 찾을 수 없습니다"
              exit 1
            fi

            CRED_DIR="$VOLUME_HOST_PATH/.claude"
            CRED_FILE="$CRED_DIR/.credentials.json"

            # SUDO() 함수는 비밀번호를 stdin으로 파이프하므로(echo "$PW" | sudo -S),
            # 시크릿 내용을 SUDO로 감싼 명령에 직접 파이프할 수 없다. sudo가 필요 없는
            # 임시 파일에 먼저 쓰고, SUDO cp로 옮기는 방식으로 이 문제를 피한다.
            TMP_FILE=$(mktemp)
            chmod 600 "$TMP_FILE"
            trap 'rm -f "$TMP_FILE"' EXIT
            printf '%s' "$CLAUDE_CREDENTIALS_JSON" > "$TMP_FILE"

            echo "📁 자격증명 디렉토리 생성: $CRED_DIR"
            SUDO mkdir -p "$CRED_DIR"

            # CRED_DIR가 이전 실행에서 이미 1001:1001 / 0700으로 좁혀져 있으면
            # (SSH 접속 유저가 1001이 아닌 한) sudo 없는 `-f` 테스트는 그 안을
            # 순회하지 못해 항상 false가 된다 - SUDO로 테스트해야 두 번째
            # 실행부터도 백업이 제대로 남는다 (PR #21 리뷰, Codex).
            if SUDO test -f "$CRED_FILE"; then
              echo "💾 기존 자격증명 백업: $CRED_FILE.bak"
              SUDO cp -p "$CRED_FILE" "$CRED_FILE.bak"
              HAD_PREVIOUS_CRED=1
            else
              HAD_PREVIOUS_CRED=0
            fi

            echo "📝 자격증명 파일 반영: $CRED_FILE"
            SUDO cp "$TMP_FILE" "$CRED_FILE"

            echo "🔐 소유권/권한 설정 (UID 1001, 0600)"
            SUDO chown 1001:1001 "$CRED_DIR" "$CRED_FILE"
            SUDO chmod 700 "$CRED_DIR"
            SUDO chmod 600 "$CRED_FILE"

            echo "✅ 인증 복구 검증 중... (컨테이너: $CONTAINER_NAME)"
            if ! SUDO docker exec "$CONTAINER_NAME" claude-window-keeper status claude; then
              echo "❌ 인증 복구 검증 실패 - 방금 반영한 자격증명을 롤백합니다"
              if [ "$HAD_PREVIOUS_CRED" = "1" ]; then
                SUDO mv "$CRED_FILE.bak" "$CRED_FILE"
                echo "↩️ 이전 자격증명으로 복원했습니다: $CRED_FILE"
              else
                SUDO rm -f "$CRED_FILE"
                echo "🗑️ 이전 자격증명이 없었으므로 새로 쓴 파일을 제거했습니다"
              fi
              exit 1
            fi
